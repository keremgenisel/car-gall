# docs/git.md § 4 — Bir PR bu kapıların HEPSİ yeşil olmadan merge edilmez.
# "Sonra düzeltiriz" yoktur; kırmızı pipeline ile merge yoktur.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ADR 0008 / K6 — main'in yeşilliği zamanla da bozulabilir.
  # Ölçüldü: 2026-10-05T13:14 ile 2026-10-10T06:03 arasında bu depoda HİÇBİR koşu yok
  # (4 gün 16 saat 49 dakika) ve main o sürenin dördünde kırmızıydı. Kırmızılığı ne bir
  # dal ne bir birleşim üretti — TAKVİM üretti: bir testin sahte saati 2026-09-22'ye
  # sabitti ve ondan üretilen çerez Expires'ını gerçek saat değerlendiriyordu (spec 0006
  # kaçan hata, PR #38). Bulan şey, ilgisiz bir chore dalının PR koşusu oldu.
  # Zamanlı koşu daima varsayılan dalı (main) kullanır — izlemek istediğimiz şey tam o.
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC — her gün
  # Gece koşusu elle de tetiklenebilsin: kırmızı bir sabahtan sonra düzeltmeyi beklemeden
  # tekrar koşmak gerekir.
  workflow_dispatch:

concurrency:
  # Olay adı gruba DAHİL: aksi hâlde gece koşusu ile main'e yapılan bir push aynı gruba
  # düşer ve `cancel-in-progress` gerçek bir merge'in CI'ını iptal edebilirdi.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build, xUnit, mimari testler, migration şema kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Uyarılar hata olarak derlenir (Directory.Build.props).
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Entegrasyon testleri Testcontainers ile GERÇEK PostgreSQL kullanır;
      # SQLite in-memory ile EF testi yapılmaz (docs/testing.md § 1).
      # Mimari testler ve migration şema kontrolü de bu koşunun içindedir.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      # ADR 0008 / K8 — kapı DÜZELTMEZ, BİLDİRİR; bildirdiği yer okunabilir olmak zorunda.
      # Ölçüldü: `ITestOutputHelper` çıktısı GEÇEN testler için konsola basılmaz, yalnız
      # trx'in içine girer — yani rapor, birinin artefaktı indirip XML açmasını bekliyordu.
      # Bu adım onu iş özetine yazar. Kapı kırmızı vermediği için `if: always()`.
      - name: Arşiv kapısı raporu (muaf kartlar)
        if: always()
        # BİLDİREN bir adım CI'ı kıramaz: build düşmüşse `--no-build` de düşer ve kırmızı,
        # kapının bildirdiği şeyi değil kendisini anlatırdı.
        continue-on-error: true
        run: |
          # `tee`: rapor hem iş özetine hem İŞ KAYDINA yazılır. Yalnız özete yazmak, bu
          # adımın çözdüğü hatanın hafif hâli olurdu — iş özetinin API'den okunabilen bir
          # karşılığı yok ve bu depodaki okuyucular `gh run view --log` kullanıyor.
          {
            echo '### Arşiv kapısı — muaf kartların kapanmamış kayıtları'
            echo '_ADR 0008 / K8: bu kayıtlar DÜZELTİLMEZ, tarihli kayıttır._'
            echo '```'
            dotnet test tests/Architecture.Tests/Architecture.Tests.csproj \
              --no-build --configuration Release --nologo \
              --filter "FullyQualifiedName~Bildirir_MuafKartlarinKapanmamisKayitlarini" \
              --logger "console;verbosity=detailed" \
              | sed -n '/Muaf kartlarda/,/^[[:space:]]*$/p'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  frontend:
    name: Frontend — lint, tip kontrolü, testler, build, çeviri anahtarları
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      # docs/frontend.md § 8 — biçim Prettier'ın işi; lint biçimle uğraşmaz.
      - name: Biçim kontrolü (Prettier)
        run: npm run format:check

      # Fiziksel CSS yön özellikleri yasaktır (C6, Yasak Listesi 25).
      - name: Lint (CSS — logical properties)
        run: npm run lint:css

      # Kullanıcıya görünen metin koda gömülemez (C4, Yasak Listesi 24).
      - name: Sert kodlanmış metin kontrolü
        run: npm run check:text

      # tr/ar/en katalogları anahtar bazında eşit olmalı (docs/testing.md § 3).
      - name: Eksik çeviri anahtarı kontrolü
        run: npm run check:locales

      # docs/frontend.md § 1 ve § 4.2 — klasör yapısı ve bileşen envanteri.
      - name: Klasör yapısı ve envanter kontrolü
        run: npm run check:structure

      # 0006 C17/AC-29 — oturum bilgisi JS'ten okunabilir bir yerde tutulamaz.
      - name: Oturum saklama kontrolü
        run: npm run check:session

      # frontend-002 AC-4, AC-8 — token adları anlamsal, yazı tipleri kendi kaynağımızdan.
      - name: Token katmanı kontrolü
        run: npm run check:tokens

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim testleri
        run: npm run test

      - name: Production build
        run: npm run build

  e2e:
    name: E2E — kritik akışlar, üç durum ve RTL
    runs-on: ubuntu-latest

    env:
      # TEK KAYNAK. Host'un kurulum hesabı ile E2E'nin globalSetup'ı aynı parolayı
      # kullanmak ZORUNDA: ikisi ayrı ayrı yazıldığında globalSetup 401 alıyor ve
      # bütün E2E paketi düşüyor. İkisi de buradan okur.
      SEED_ADMIN_PASSWORD: ci-kurulum-parolasi

    # 8 kriterin (AC-10, 14, 18, 19, 26, 27, 28, 30) CI'da koşan tek testi buradadır;
    # bu iş olmadan o kriterler kapısız kalır.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cionly
          POSTGRES_DB: cargallery
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

      # 0009 — bildirim kuyruğu gerçekten SMTP konuşuyor. Sunucu olmadan kuyruk her
      # turda geçici hatayla döner ve CI logları anlamsız gürültüyle dolardı.
      mailpit:
        image: axllent/mailpit:v1.21
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
        ports: ['1025:1025', '8025:8025']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Playwright tarayıcısı
        working-directory: frontend
        run: npm run test:e2e:install

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Host'u seed ederek başlat
        env:
          ConnectionStrings__VehicleCatalog: Host=localhost;Port=5432;Database=cargallery;Username=postgres;Password=cionly
          Development__SeedShowcase: 'true'
          Development__SeedListingCount: '200'
          # D2/AC-53 — parola yapılandırmadan gelir ve repoda durmaz; yoksa uygulama
          # hiç başlamaz. Bu değer yalnız CI'ın tek kullanımlık veritabanı içindir.
          Identity__SeedAdmin__Password: ${{ env.SEED_ADMIN_PASSWORD }}
          # Kanıt üretimi her girişte 210.000 iterasyon beklemesin.
          Identity__PasswordIterations: '1000'
          # Kanıt üretimi ve E2E akışları çok sayıda giriş yapar; giriş ucunun
          # İSTEK sınırı (R6'nın ikinci yarısı) testleri birbirini zehirlemesin.
          # Hesap KİLİDİ varsayılan eşikte kalır ve AC-6/AC-7 onu sınar.
          Identity__LoginRequestLimit: '500'
          # C17'nin eşiği (10 dakikada 5 TALEP) üretim varsayılanıdır ve Host.Tests onu
          # varsayılan hâliyle sınar. Kanıt üretimi üç locale'de başarılı gönderim ve
          # hata senaryoları ister; aynı IP'den bu sayı kolayca aşılır ve testler
          # birbirini zehirlerdi. Sınırın KENDİSİ burada değil, Host.Tests'te sınanıyor.
          Leads__RateLimit__CapturedLeadLimit: '500'
          Leads__RateLimit__RequestLimit: '500'
          # 0009 — uygulama sağlayıcı kimlik bilgileri olmadan HİÇ başlamaz (AC-28).
          # Bu değerler mailpit servisinin kabul ettiği tek kullanımlık değerlerdir.
          Notifications__Smtp__Host: localhost
          Notifications__Smtp__Port: '1025'
          Notifications__Smtp__User: ci
          Notifications__Smtp__Password: ci
          Notifications__PublicBaseUrl: http://localhost:5080
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          # Migration'ı çalışan uygulama değil, bu tek seferlik kurulum adımı uygular
          # (docs/decisions/0002). Uygulama yalnız doğrular; adım atlanırsa hiç başlamaz.
          dotnet run --project src/Host/Host.csproj --no-launch-profile -c Release -- --migrate
          dotnet run --project src/Host/Host.csproj --no-launch-profile -c Release &
          # SINIRLI bekleme. Sınırsız `until` döngüsü, başlamayı REDDEDEN bir Host'ta
          # (kurulum adımı atlanmış, eksik yapılandırma, eksik şema) işi GitHub'ın
          # 6 saatlik sınırına kadar asılı bırakır — sessiz bir maliyet.
          # Başlamıyorsa iki dakikada, gürültüyle düşsün.
          for _ in $(seq 120); do
            curl -sf -o /dev/null http://localhost:5080/api/catalog/field-settings && exit 0
            sleep 1
          done
          echo "Host 120 saniyede ayağa kalkmadı." >&2
          exit 1

      - name: E2E testleri (mobil + masaüstü)
        working-directory: frontend
        env:
          E2E_SEED_ADMIN_PASSWORD: ${{ env.SEED_ADMIN_PASSWORD }}
        run: npm run test:e2e

      # Kanıt üretimi artık AÇIKÇA istenir (`npm run evidence`); CI'ın e2e koşusu hiçbir
      # görsel yazmaz ve çalışma ağacını kirletmez. Bu yüzden yüklenecek bir değişiklik
      # de yok — kanıtlar depoda, PR'da doğrudan görülür (docs/testing.md § 3).
      - name: Kanıt dosyaları değişmedi mi?
        run: |
          if ! git diff --quiet -- docs/evidence; then
            echo "E2E koşusu kanıt görsellerini değiştirdi; bu artık olmamalı." >&2
            git diff --stat -- docs/evidence >&2
            exit 1
          fi
