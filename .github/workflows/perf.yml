# C3 ölçüm protokolü — HARFİYEN uygulanır ve her koşuda raporlanır.
#   Sunucu: 500 ilanlık sabit veri seti, iki kasa tipiyle daraltılmış istek,
#           20 ısınma + 200 ölçüm, eşzamanlılık 1, p95 < 400 ms (AC-34)
#   Uç:     Lighthouse mobil profili, 3 koşu, medyan; LCP < 2,5 s (AC-35), CLS < 0,1 (AC-25)
name: Performans

on:
  pull_request:
  workflow_dispatch:

jobs:
  thresholds:
    name: C3 eşikleri
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cionly
          POSTGRES_DB: cargallery
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

      # 0009 — bildirim kuyruğu gerçekten SMTP konuşuyor. Sunucu olmadan kuyruk her
      # turda geçici hatayla döner ve CI logları anlamsız gürültüyle dolardı.
      mailpit:
        image: axllent/mailpit:v1.21
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
        ports: ['1025:1025', '8025:8025']

    steps:
      # ADR 0011 — kurulum parolası koşu başına üretilir ve kayıtlarda maskelenir.
      - name: Kurulum parolası üret
        run: |
          PAROLA=$(openssl rand -hex 16)
          echo "::add-mask::$PAROLA"
          echo "SEED_ADMIN_PASSWORD=$PAROLA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Host'u 500 ilanla başlat
        env:
          ConnectionStrings__VehicleCatalog: Host=localhost;Port=5432;Database=cargallery;Username=postgres;Password=cionly
          Development__SeedShowcase: 'true'
          Development__SeedListingCount: '500'
          # D2/AC-53 — uygulama bu parola olmadan HİÇ başlamaz. Ölçüm işi giriş
          # yapmaz ama Host'u ayağa kaldırmak zorunda. ADR 0011 — değer SABİT DEĞİL:
          # önceki adımda üretilip `$GITHUB_ENV`'e yazılıyor ve kayıtlarda maskeli.
          Identity__SeedAdmin__Password: ${{ env.SEED_ADMIN_PASSWORD }}
          # Kurulum hesabı bir kez özetleniyor; ölçüm başlangıcını 210.000 iterasyon
          # beklememeli.
          Identity__PasswordIterations: '1000'
          # 0009 — uygulama sağlayıcı kimlik bilgileri olmadan HİÇ başlamaz (AC-28).
          # Bu değerler mailpit servisinin kabul ettiği tek kullanımlık değerlerdir.
          Notifications__Smtp__Host: localhost
          Notifications__Smtp__Port: '1025'
          Notifications__Smtp__User: ci
          Notifications__Smtp__Password: ci
          Notifications__PublicBaseUrl: http://localhost:5080
          # 0011 — uygulama medya yapılandırması olmadan HİÇ başlamaz (AC-31…33) ve bu iş
          # de Host'u ayağa kaldıran yerlerden biri. İlk yazımda ATLANDI: C6'yı eklerken
          # beş çağrı yeri saydım, altıncısı buydu ve `perf.yml` koşusu
          # `media.storage_credentials_missing` ile 134 verdi. Kural doğru çalıştı,
          # sayım eksikti.
          #
          # Gerçek bir depolama servisi yok ve gerekmiyor: bu iş vitrin sorgusunun
          # gecikmesini ölçüyor, medya yüklemiyor.
          Media__Storage__ServiceUrl: http://localhost:54566
          Media__Storage__Bucket: cargallery-media
          Media__Storage__AccessKey: perf
          Media__Storage__SecretKey: perf
          Media__Storage__Region: us-east-1
          Media__PublicBaseUrl: http://localhost:54566/cargallery-media/
          Media__WatermarkObjectKey: private/brand/watermark.png
          # AC-9 — tür kümesi yapılandırmadan; boş küme kuruluşta reddedilir.
          Media__AllowedImageFormats__0: jpeg
          Media__AllowedImageFormats__1: png
          Media__AllowedImageFormats__2: webp
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          # Kurulum adımı (ADR 0002): şemayı uygulayan budur. Bu iş onu çalıştırmıyordu,
          # bu yüzden Host başlamayı reddediyordu.
          dotnet run --project src/Host/Host.csproj --no-launch-profile -c Release -- --migrate
          dotnet run --project src/Host/Host.csproj --no-launch-profile -c Release &
          # SINIRLI bekleme. Sınırsız `until` döngüsü, başlamayı REDDEDEN bir Host'ta
          # (kurulum adımı atlanmış, eksik yapılandırma, eksik şema) işi GitHub'ın
          # 6 saatlik sınırına kadar asılı bırakır — sessiz bir maliyet.
          # Başlamıyorsa iki dakikada, gürültüyle düşsün.
          for _ in $(seq 120); do
            curl -sf -o /dev/null http://localhost:5080/api/catalog/field-settings && exit 0
            sleep 1
          done
          echo "Host 120 saniyede ayağa kalkmadı." >&2
          exit 1

      # AC-34
      - name: Sunucu p95 ölçümü
        run: dotnet run --project tests/Performance/ShowcaseListingBenchmark/ShowcaseListingBenchmark.csproj -c Release

      # AC-35 ve AC-25
      - name: Uç LCP ve CLS ölçümü
        working-directory: frontend
        run: npm run perf:lighthouse

      - name: Ölçüm raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: docs/evidence/0001-performance.json
          if-no-files-found: warn
